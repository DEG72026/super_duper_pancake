          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef select_best_model(\n    model_d2: Input[Model],\n    model_d3:\
          \ Input[Model],\n    model_d4: Input[Model],\n    model_dnone: Input[Model],\n\
          \    acc_d2: float,\n    acc_d3: float,\n    acc_d4: float,\n    acc_dnone:\
          \ float,\n    best_model: Output[Model],\n) -> NamedTuple(\"BestModel\"\
          , [(\"accuracy\", float), (\"max_depth\", int)]):\n    import shutil\n \
          \   from collections import namedtuple\n\n    # simplest first, so on a\
          \ tie the first (simplest) one stays the best\n    candidates = [\n    \
          \    (2, acc_d2, model_d2),\n        (3, acc_d3, model_d3),\n        (4,\
          \ acc_d4, model_d4),\n        (0, acc_dnone, model_dnone),\n    ]\n    best_depth,\
          \ best_acc, best = candidates[0]\n    for depth, acc, candidate in candidates[1:]:\n\
          \        if acc > best_acc:\n            best_depth, best_acc, best = depth,\
          \ acc, candidate\n\n    shutil.copy(best.path, best_model.path)\n    best_model.metadata[\"\
          max_depth\"] = best_depth\n    best_model.metadata[\"accuracy\"] = best_acc\n\
          \    print(f\"Best: max_depth={best_depth or 'None'}, accuracy={best_acc:.3f}\"\
          )\n\n    BestModel = namedtuple(\"BestModel\", [\"accuracy\", \"max_depth\"\
          ])\n    return BestModel(best_acc, best_depth)\n\n"
