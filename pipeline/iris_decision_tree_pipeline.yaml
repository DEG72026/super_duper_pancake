          \ shutil\n    from datetime import datetime, timezone\n\n    version = datetime.now(timezone.utc).strftime(\"\
          %Y%m%d-%H%M%S\")\n    os.makedirs(os.path.join(model_dir, \"versions\"),\
          \ exist_ok=True)\n\n    version_path = os.path.join(model_dir, \"versions\"\
          , f\"model-{version}.joblib\")\n    shutil.copy(best_model.path, version_path)\n\
          \n    info = {\"accuracy\": accuracy, \"max_depth\": max_depth, \"version\"\
          : version}\n    with open(os.path.join(model_dir, \"metrics.json\"), \"\
          w\") as f:\n        json.dump(info, f)\n\n    # written last on purpose:\
          \ this is the file that triggers the API redeploy\n    shutil.copy(best_model.path,\
          \ os.path.join(model_dir, \"model.joblib\"))\n\n    print(f\"Saved model\
          \ {version} to {model_dir}\")\n    return version_path\n\n"
