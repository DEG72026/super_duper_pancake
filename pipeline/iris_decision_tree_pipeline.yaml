      tasks:
        save-model:
          cachingOptions: {}
          componentRef:
            name: comp-save-model
          inputs:
            artifacts:
              best_model:
                componentInputArtifact: pipelinechannel--select-best-model-best_model
            parameters:
              accuracy:
                componentInputParameter: pipelinechannel--select-best-model-accuracy
