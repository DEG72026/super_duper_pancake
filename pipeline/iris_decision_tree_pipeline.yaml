pipelineInfo:
  description: Trains Decision Trees on Iris, picks the best and saves it to Cloud
    Storage.
  name: iris-decision-tree-training
root:
  dag:
    tasks:
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - split-data
        - train-model
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
            test_set:
              taskOutputArtifact:
                outputArtifactKey: test_set
                producerTask: split-data
          parameters:
            max_depth:
              runtimeValue:
                constant: 2.0
        taskInfo:
          name: evaluate-depth-2
      evaluate-model-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model-2
        dependentTasks:
        - split-data
        - train-model-2
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-2
            test_set:
              taskOutputArtifact:
                outputArtifactKey: test_set
                producerTask: split-data
          parameters:
            max_depth:
              runtimeValue:
                constant: 3.0
        taskInfo:
          name: evaluate-depth-3
      evaluate-model-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model-3
        dependentTasks:
        - split-data
        - train-model-3
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-3
            test_set:
              taskOutputArtifact:
                outputArtifactKey: test_set
                producerTask: split-data
          parameters:
            max_depth:
              runtimeValue:
                constant: 4.0
        taskInfo:
          name: evaluate-depth-4
      evaluate-model-4:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model-4
        dependentTasks:
        - split-data
        - train-model-4
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-4
            test_set:
              taskOutputArtifact:
                outputArtifactKey: test_set
                producerTask: split-data
          parameters:
            max_depth:
              runtimeValue:
                constant: 0.0
        taskInfo:
          name: evaluate-depth-none
      load-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data
        inputs:
          parameters:
            data_path:
              componentInputParameter: data_path
        taskInfo:
          name: load-data
      save-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-save-model
        dependentTasks:
        - select-best-model
        inputs:
          artifacts:
            best_model:
              taskOutputArtifact:
                outputArtifactKey: best_model
                producerTask: select-best-model
          parameters:
            model_dir:
              componentInputParameter: model_dir
        taskInfo:
          name: save-model
      select-best-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-select-best-model
        dependentTasks:
        - evaluate-model
        - evaluate-model-2
        - evaluate-model-3
        - evaluate-model-4
        - train-model
        - train-model-2
        - train-model-3
        - train-model-4
        inputs:
          artifacts:
            model_d2:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
            model_d3:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-2
            model_d4:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-3
            model_dnone:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-4
          parameters:
            acc_d2:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: evaluate-model
            acc_d3:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: evaluate-model-2
            acc_d4:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: evaluate-model-3
            acc_dnone:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: evaluate-model-4
        taskInfo:
          name: select-best-model
      split-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-split-data
        dependentTasks:
        - load-data
        inputs:
          artifacts:
            dataset:
              taskOutputArtifact:
                outputArtifactKey: dataset
                producerTask: load-data
          parameters:
            random_state:
              componentInputParameter: random_state
            test_size:
              componentInputParameter: test_size
        taskInfo:
          name: split-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - split-data
        inputs:
          artifacts:
            train_set:
              taskOutputArtifact:
                outputArtifactKey: train_set
                producerTask: split-data
          parameters:
            max_depth:
              runtimeValue:
                constant: 2.0
        taskInfo:
          name: train-depth-2
      train-model-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model-2
        dependentTasks:
        - split-data
        inputs:
          artifacts:
            train_set:
              taskOutputArtifact:
                outputArtifactKey: train_set
                producerTask: split-data
          parameters:
            max_depth:
              runtimeValue:
                constant: 3.0
        taskInfo:
          name: train-depth-3
      train-model-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model-3
        dependentTasks:
        - split-data
        inputs:
          artifacts:
            train_set:
              taskOutputArtifact:
                outputArtifactKey: train_set
                producerTask: split-data
          parameters:
            max_depth:
              runtimeValue:
                constant: 4.0
        taskInfo:
          name: train-depth-4
      train-model-4:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model-4
        dependentTasks:
        - split-data
        inputs:
          artifacts:
            train_set:
              taskOutputArtifact:
                outputArtifactKey: train_set
                producerTask: split-data
          parameters:
            max_depth:
              runtimeValue:
                constant: 0.0
        taskInfo:
          name: train-depth-none
  inputDefinitions:
    parameters:
      data_path:
        defaultValue: /gcs/group7-iris-data/iris.csv
        isOptional: true
        parameterType: STRING
      model_dir:
        defaultValue: /gcs/group7-iris-models/model
        isOptional: true
        parameterType: STRING
      random_state:
        defaultValue: 42.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      test_size:
        defaultValue: 0.2
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.3
