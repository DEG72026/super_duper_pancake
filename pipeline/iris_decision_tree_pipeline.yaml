          \    random_state: int,\n    train_set: Output[Dataset],\n    test_set:\
          \ Output[Dataset],\n):\n    \"\"\"Stratified train/test split, same settings\
          \ as the local script.\"\"\"\n    import pandas as pd\n    from sklearn.model_selection\
          \ import train_test_split\n\n    df = pd.read_csv(dataset.path)\n    train_df,\
          \ test_df = train_test_split(\n        df,\n        test_size=test_size,\n\
          \        random_state=random_state,\n        stratify=df[\"species\"],\n\
          \    )\n    train_df.to_csv(train_set.path, index=False)\n    test_df.to_csv(test_set.path,\
          \ index=False)\n    print(f\"Train rows: {len(train_df)}, test rows: {len(test_df)}\"\
