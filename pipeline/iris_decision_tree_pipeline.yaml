deploymentSpec:
  executors:
    exec-check-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - check_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.2'\
          \ 'numpy==1.26.4' 'scikit-learn==1.4.1.post1' 'joblib==1.3.2'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location 'kfp==2.17.3' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef check_model(\n    best_model: Input[Model],\n    accuracy: float,\n\
          \    model_dir: str,\n    min_accuracy: float,\n    gate_metrics: Output[Metrics],\n\
          ) -> str:\n    import json\n    import os\n\n    import joblib\n\n    tree\
          \ = joblib.load(best_model.path)\n\n    # one typical flower per species\
          \ (taken from the Iris data set)\n    examples = [\n        ([5.1, 3.5,\
          \ 1.4, 0.2], 0),  # setosa\n        ([6.0, 2.9, 4.5, 1.5], 1),  # versicolor\n\
          \        ([6.9, 3.1, 5.4, 2.1], 2),  # virginica\n    ]\n    examples_ok\
          \ = all(int(tree.predict([x])[0]) == y for x, y in examples)\n\n    # the\
          \ champion's accuracy is saved next to the model by save_model\n    champion_file\
          \ = os.path.join(model_dir, \"metrics.json\")\n    champion_acc = -1.0 \
          \ # no model deployed yet -> any good model wins\n    if os.path.exists(champion_file):\n\
          \        with open(champion_file) as f:\n            champion_acc = float(json.load(f)[\"\
          accuracy\"])\n\n    decision = \"deploy\"\n    if accuracy < min_accuracy:\n\
          \        decision = \"keep\"\n        print(f\"Accuracy {accuracy:.3f} is\
          \ below the minimum {min_accuracy}\")\n    elif accuracy < champion_acc:\n\
          \        decision = \"keep\"\n        print(f\"Accuracy {accuracy:.3f} is\
          \ worse than the current model ({champion_acc:.3f})\")\n    elif not examples_ok:\n\
          \        decision = \"keep\"\n        print(\"Model gets one of the example\
          \ flowers wrong\")\n\n    gate_metrics.log_metric(\"challenger_accuracy\"\
          , accuracy)\n    gate_metrics.log_metric(\"champion_accuracy\", champion_acc)\n\
          \    gate_metrics.log_metric(\"deploy\", 1 if decision == \"deploy\" else\
          \ 0)\n    print(f\"Decision: {decision}\")\n    return decision\n\n"
        image: python:3.10-slim
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.2'\
          \ 'numpy==1.26.4' 'scikit-learn==1.4.1.post1' 'joblib==1.3.2'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location 'kfp==2.17.3' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    model: Input[Model],\n    test_set: Input[Dataset],\n\
          \    max_depth: int,\n    metrics: Output[Metrics],\n) -> float:\n    import\
          \ joblib\n    import pandas as pd\n    from sklearn.metrics import accuracy_score\n\
          \n    features = [\"sepal_length\", \"sepal_width\", \"petal_length\", \"\
          petal_width\"]\n    df = pd.read_csv(test_set.path)\n\n    tree = joblib.load(model.path)\n\
          \    accuracy = float(accuracy_score(df[\"species\"].values, tree.predict(df[features].values)))\n\
          \n    # logged metrics show up in the Vertex AI pipeline UI\n    metrics.log_metric(\"\
          accuracy\", accuracy)\n    metrics.log_metric(\"max_depth\", max_depth)\n\
          \    print(f\"max_depth={max_depth}: accuracy={accuracy:.3f}\")\n    return\
          \ accuracy\n\n"
        image: python:3.10-slim
    exec-evaluate-model-2:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
