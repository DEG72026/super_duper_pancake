# PIPELINE DEFINITION
# Name: iris-decision-tree-training
# Description: Trains Decision Trees on Iris, checks the best one and saves it for the API.
# Inputs:
#    data_path: str [Default: '/gcs/group7-iris-data/iris.csv']
#    min_accuracy: float [Default: 0.9]
#    model_dir: str [Default: '/gcs/group7-iris-models/model']
#    random_state: int [Default: 42.0]
#    test_size: float [Default: 0.2]
components:
  comp-check-model:
    executorLabel: exec-check-model
    inputDefinitions:
      artifacts:
        best_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        accuracy:
          parameterType: NUMBER_DOUBLE
        min_accuracy:
          parameterType: NUMBER_DOUBLE
        model_dir:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        gate_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-condition-1:
