deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.2'\
          \ 'numpy==1.26.4' 'scikit-learn==1.4.1.post1' 'joblib==1.3.2'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location 'kfp==2.17.3' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    model: Input[Model],\n    test_set: Input[Dataset],\n\
          \    max_depth: int,\n    metrics: Output[Metrics],\n) -> float:\n    \"\
          \"\"Return the model's accuracy and log it so it shows in the Vertex UI.\"\
          \"\"\n    import joblib\n    import pandas as pd\n    from sklearn.metrics\
          \ import accuracy_score\n\n    features = [\"sepal_length\", \"sepal_width\"\
          , \"petal_length\", \"petal_width\"]\n    df = pd.read_csv(test_set.path)\n\
          \n    classifier = joblib.load(model.path)\n    predictions = classifier.predict(df[features].values)\n\
          \    accuracy = float(accuracy_score(df[\"species\"].values, predictions))\n\
          \n    metrics.log_metric(\"accuracy\", accuracy)\n    metrics.log_metric(\"\
          max_depth\", max_depth)\n    print(f\"max_depth={max_depth}: accuracy={accuracy:.3f}\"\
          )\n    return accuracy\n\n"
        image: python:3.10-slim
