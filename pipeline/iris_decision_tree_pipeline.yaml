          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef save_model(best_model: Input[Model], model_dir: str) -> str:\n\
          \    \"\"\"Write the model to the model bucket twice:\n    - model_dir/model.joblib\
          \            fixed name, loaded by the API\n    - model_dir/versions/<time>.joblib\
          \  a kept copy of every training run\n    \"\"\"\n    import os\n    import\
          \ shutil\n    from datetime import datetime, timezone\n\n    version = datetime.now(timezone.utc).strftime(\"\
          %Y%m%d-%H%M%S\")\n    os.makedirs(os.path.join(model_dir, \"versions\"),\
          \ exist_ok=True)\n\n    latest_path = os.path.join(model_dir, \"model.joblib\"\
          )\n    version_path = os.path.join(model_dir, \"versions\", f\"model-{version}.joblib\"\
          )\n    shutil.copy(best_model.path, version_path)\n    shutil.copy(best_model.path,\
          \ latest_path)\n\n    print(f\"Saved model to {latest_path} (version copy:\
          \ {version_path})\")\n    return version_path\n\n"
        image: python:3.10-slim
