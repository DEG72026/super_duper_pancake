          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.2'\
          \ 'numpy==1.26.4' 'scikit-learn==1.4.1.post1' 'joblib==1.3.2'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location 'kfp==2.17.3' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
