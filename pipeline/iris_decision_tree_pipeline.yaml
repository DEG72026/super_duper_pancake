          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef select_best_model(\n    model_d2: Input[Model],\n    model_d3:\
          \ Input[Model],\n    model_d4: Input[Model],\n    model_dnone: Input[Model],\n\
          \    acc_d2: float,\n    acc_d3: float,\n    acc_d4: float,\n    acc_dnone:\
          \ float,\n    best_model: Output[Model],\n    best_metrics: Output[Metrics],\n\
          ):\n    \"\"\"Copy the most accurate model to the output. Ties go to the\
          \ simpler\n    (shallower) tree, because it is less likely to overfit.\"\
          \"\"\n    import shutil\n\n    # Ordered from simplest to most complex,\
          \ so ties pick the simpler tree.\n    candidates = [\n        (2, acc_d2,\
          \ model_d2),\n        (3, acc_d3, model_d3),\n        (4, acc_d4, model_d4),\n\
          \        (0, acc_dnone, model_dnone),\n    ]\n    best_depth, best_acc,\
          \ best = candidates[0]\n    for depth, acc, candidate in candidates[1:]:\n\
          \        if acc > best_acc:\n            best_depth, best_acc, best = depth,\
          \ acc, candidate\n\n    shutil.copy(best.path, best_model.path)\n    best_model.metadata[\"\
          max_depth\"] = best_depth\n    best_model.metadata[\"accuracy\"] = best_acc\n\
          \    best_metrics.log_metric(\"best_accuracy\", best_acc)\n    best_metrics.log_metric(\"\
          best_max_depth\", best_depth)\n    print(f\"Best model: max_depth={best_depth\
          \ or 'None'}, accuracy={best_acc:.3f}\")\n\n"
        image: python:3.10-slim
