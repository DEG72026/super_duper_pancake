substitutions:
  _REGION: europe-west4
  _AR_REPO: mlops-repo-group7
  _API_SERVICE: iris-api
  _API_IMAGE: iris-api

steps:

# Run the API unit tests; the build stops here if a test fails
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r api/requirements.txt pytest
        python -m pytest api_test/


# Build API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_API_IMAGE}:${BUILD_ID}',
        '.'
      ]
    dir: 'api'

  
# Push API Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_API_IMAGE}:${BUILD_ID}'
      ]

  
# Deploy API to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run',
        'deploy',
        '${_API_SERVICE}',
        '--image',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_API_IMAGE}:${BUILD_ID}',
        '--region',
        '${_REGION}',
        '--platform',
        'managed',
        '--allow-unauthenticated'
      ]

timeout: '900s'

# Logging option to fix service account error
options:
  logging: CLOUD_LOGGING_ONLY
